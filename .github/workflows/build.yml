name: Build Odin Hub

# Só valida o código (testes + APK de debug) em cada push / PR. As RELEASES já não são feitas
# aqui: são compiladas e publicadas no computador do autor com scripts/release.sh, para saírem
# sempre assinadas com a mesma chave (cada runner do GitHub tem uma chave de debug diferente,
# e um APK assim nunca instala por cima da versão anterior).
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Dar permissao de execucao ao Gradle
        run: chmod +x gradlew

      - name: Rodar os testes unitarios (Debug)
        run: ./gradlew testDebugUnitTest

      - name: Upload do relatorio de testes (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest

      - name: Compilar o APK (Debug)
        run: ./gradlew assembleDebug

      - name: Fazer Upload do APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: OdinHub-debug
          path: app/build/outputs/apk/debug/*.apk
